  - Доброе утро
  - Добрый вечер
  - Lance
  - Lens
  - Lanes
  - Lands
  - Jarring
  - Charges
  - Jargon
  - Jungle
  - Jingle

speech_negatives:
  enabled: true
  dataset: bond005/sberdevices_golos_10h_crowd
  split: train
  max_chunks: 5000
  batch_n: 200
